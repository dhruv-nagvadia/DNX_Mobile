apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Firebase (FCM push). Applied only once android/app/google-services.json exists, so the
// app still builds without a Firebase project. Download the file from the Firebase console.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("google-services.json not found in android/app - Firebase/push notifications disabled for this build.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Release signing (Play Store upload key).
 * Create the keystore once (keep it + passwords safe, outside the repo):
 *   keytool -genkeypair -v -storetype PKCS12 -keystore dnx-upload.keystore \
 *     -alias dnx-upload -keyalg RSA -keysize 2048 -validity 10000
 * Then add to ~/.gradle/gradle.properties (preferred) or android/gradle.properties:
 *   DNX_UPLOAD_STORE_FILE=/absolute/path/to/dnx-upload.keystore
 *   DNX_UPLOAD_STORE_PASSWORD=*****
 *   DNX_UPLOAD_KEY_ALIAS=dnx-upload
 *   DNX_UPLOAD_KEY_PASSWORD=*****
 * Without these, release builds fall back to the debug keystore (NOT uploadable to Play).
 */
def hasReleaseSigning = ["DNX_UPLOAD_STORE_FILE", "DNX_UPLOAD_STORE_PASSWORD", "DNX_UPLOAD_KEY_ALIAS", "DNX_UPLOAD_KEY_PASSWORD"]
        .every { project.hasProperty(it) && project.property(it).toString().trim() }

/**
 * Plain-http API in release builds. Release builds block http:// by default, which is right
 * for the real HTTPS domain but breaks local release testing (staging/production envs on this
 * Mac use http://<LAN-IP>:4001/4002). Read the same .env.<APP_ENV> file the JS bundle uses
 * (APP_ENV comes from the npm script, default production) and allow cleartext only while its
 * API_BASE_URL is http://. Once production points at https://, cleartext is off automatically.
 */
def appEnv = System.getenv("APP_ENV") ?: "production"
def envFile = rootProject.file("../.env.${appEnv}")
def apiBaseUrl = envFile.exists()
        ? (envFile.readLines().find { it.trim().startsWith("API_BASE_URL=") }?.split("=", 2)?.getAt(1)?.trim() ?: "")
        : ""
def allowCleartext = apiBaseUrl.startsWith("http://")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dnxprovider"
    defaultConfig {
        applicationId "com.dnx.provider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Used by src/release/AndroidManifest.xml — see allowCleartext above.
        manifestPlaceholders = [usesCleartextTraffic: allowCleartext.toString()]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(DNX_UPLOAD_STORE_FILE)
                storePassword DNX_UPLOAD_STORE_PASSWORD
                keyAlias DNX_UPLOAD_KEY_ALIAS
                keyPassword DNX_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Uses the DNX_UPLOAD_* keystore when configured (see comment above), else debug.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                    logger.warn("DNX_UPLOAD_* gradle properties not set - release build will be signed with the DEBUG keystore (not uploadable to Play Store).")
                }
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
